<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>SpendSync — Smart Card & Subscription Tracker</title>
  <meta name="description" content="Track subscriptions, optimize cards, control finances with SMS detection.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet">
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="https://cdn.jsdelivr.net/npm/tsparticles@2.12.0/tsparticles.bundle.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { headline: ['Manrope', 'sans-serif'], body: ['Inter', 'sans-serif'], label: ['Inter', 'sans-serif'] },
          colors: {
            primary: '#c6c6c7', 'primary-dim': '#b8b9b9', 'primary-container': '#454747', 'on-primary': '#3f4041',
            secondary: '#ffbf00', 'secondary-dim': '#eeb200', 'secondary-container': '#4e3800', 'on-secondary': '#563e00',
            tertiary: '#ff716b', 'tertiary-container': '#ff4d4d', 'on-tertiary': '#490005',
            error: '#ee7d77', 'error-dim': '#bb5551', 'error-container': '#7f2927', 'on-error': '#490106', 'on-error-container': '#ff9993',
            'on-surface': '#e7e5e4', 'on-surface-variant': '#acabaa',
            surface: '#0e0e0e', 'surface-container-lowest': '#000000', 'surface-container-low': '#131313',
            'surface-container': '#191a1a', 'surface-container-high': '#1f2020', 'surface-container-highest': '#252626',
            'surface-bright': '#2c2c2c', outline: '#767575', 'outline-variant': '#484848',
            'chart-1': '#FF6D00', 'chart-2': '#00BFA5', 'chart-3': '#304FFE', 'chart-4': '#F50057', 'chart-5': '#FFD600',
            'brand-teal': '#00C9A7'
          },
          borderRadius: { full: '0.75rem' }
        }
      }
    }
  </script>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent
    }

    body {
      background: #0e0e0e;
      font-family: 'Inter', sans-serif;
      overflow-x: hidden
    }

    .screen {
      display: none;
      min-height: 100vh
    }

    .screen.active {
      display: block
    }

    .font-headline {
      font-family: 'Manrope', sans-serif
    }

    .font-body,
    .font-label {
      font-family: 'Inter', sans-serif
    }

    .ms {
      font-family: 'Material Symbols Outlined';
      font-variation-settings: 'FILL' 0
    }

    .ms-fill {
      font-family: 'Material Symbols Outlined';
      font-variation-settings: 'FILL' 1
    }

    .editorial-shadow {
      box-shadow: 0 32px 64px -12px rgba(231, 229, 228, 0.05)
    }

    .tap-highlight-none {
      -webkit-tap-highlight-color: transparent
    }

    ::-webkit-scrollbar {
      display: none
    }

    .hide-scroll {
      -ms-overflow-style: none;
      scrollbar-width: none
    }

    .stacked-card {
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1)
    }

    .stacked-card:hover {
      transform: translateY(-12px) scale(1.02) !important;
      z-index: 50 !important
    }
  </style>
</head>

<body class="text-on-surface min-h-screen">

  <!-- TOAST -->
  <div id="sms-toast" class="hidden fixed top-4 left-0 right-0 z-[100] mx-4 max-w-sm mx-auto"></div>

  <!-- HEADER -->
  <header id="app-header" class="sticky top-0 z-50 bg-surface text-primary">
    <div id="header-inner" class="flex justify-between items-center w-full px-6 py-4 bg-surface-container-low"></div>
  </header>

  <!-- SCREENS -->
  <div id="screen-dashboard" class="screen active"></div>
  <div id="screen-subscriptions" class="screen"></div>
  <div id="screen-add-card" class="screen"></div>
  <div id="screen-analytics" class="screen"></div>
  <div id="screen-alerts" class="screen"></div>
  <div id="screen-advisor" class="screen"></div>
  <div id="screen-dna" class="screen"></div>

  <!-- BOTTOM SHEET -->
  <div id="sms-overlay" class="hidden fixed inset-0 bg-black/60 z-[60]" onclick="closeSMSPrompt()"></div>
  <div id="sms-sheet"
    class="hidden fixed bottom-0 left-0 right-0 z-[70] bg-surface-container rounded-t-3xl max-w-sm mx-auto"
    style="max-height:75vh;overflow-y:auto">
    <div class="p-6">
      <div class="w-12 h-1 bg-outline-variant rounded-full mx-auto mb-5"></div>
      <div id="sms-sheet-content"></div>
    </div>
  </div>

  <!-- FLOATING ACTION BAR (card detail) -->
  <div id="floating-bar" class="hidden fixed bottom-24 left-0 w-full px-6 pointer-events-none z-40">
    <div
      class="max-w-sm mx-auto w-full bg-surface-container-high/90 backdrop-blur-xl border border-outline-variant/10 rounded-full p-6 flex justify-between items-center editorial-shadow pointer-events-auto">
      <div>
        <p class="font-label text-[10px] uppercase tracking-widest text-on-surface-variant mb-0.5">Total due this month
        </p>
        <p id="float-amount" class="font-headline text-2xl font-bold text-primary"></p>
      </div>
      <button
        class="bg-gradient-to-r from-primary to-primary-container text-on-primary px-8 py-3 rounded-full font-bold font-headline text-sm active:scale-95 transition-transform">Auto-Pay</button>
    </div>
  </div>

  <!-- BOTTOM NAV -->
  <nav id="bottom-nav"
    class="bg-surface-container/80 backdrop-blur-xl fixed bottom-0 left-0 w-full flex justify-around items-center px-4 pb-6 pt-3 z-50 border-t border-outline-variant/15 shadow-2xl rounded-t-3xl max-w-sm mx-auto">
  </nav>

  <script>
    /* ═══ STATE ═══ */
    const S = {
      currentScreen: 'dashboard', selectedCardId: null, alertFilter: 'all',
      pendingSMS: null, smsStep: 1, smsBillingType: null, smsCycle: null,
      newCard: { bank: '', variant: '', lastFour: '', expiry: '', network: 'Visa' },
      cards: [
        { id: 'hdfc', bank: 'HDFC Bank', variant: 'HDFC INFINIA', last4: '4521', expiry: '08/27', network: 'Visa', gradient: 'from-[#8b1d1d] via-[#e11d48] to-[#4c0519]', monthlySpend: 976 },
        { id: 'icici', bank: 'ICICI Bank', variant: 'ICICI EMERALDE', last4: '8834', expiry: '03/26', network: 'Mastercard', gradient: 'from-[#E65C00] to-[#993D00]', monthlySpend: 637 },
        { id: 'sbi', bank: 'State Bank of India', variant: 'SBI AURUM', last4: '2210', expiry: '11/28', network: 'RuPay', gradient: 'from-[#003366] to-[#001A33]', monthlySpend: 629 },
        { id: 'axis', bank: 'Axis Bank', variant: 'AXIS BANK MAGNUS', last4: '6603', expiry: '06/27', network: 'Visa', gradient: 'from-[#4A0E1C] to-[#2D0911]', monthlySpend: 1384 }
      ],
      subscriptions: [
        { id: 'sub1', name: 'Netflix', cardId: 'hdfc', amount: 649, billingType: 'recurring', cycle: 'monthly', renewalDays: 3, category: 'Entertainment', icon: 'movie', status: 'urgent' },
        { id: 'sub2', name: 'Spotify', cardId: 'hdfc', amount: 119, billingType: 'recurring', cycle: 'monthly', renewalDays: 12, category: 'Entertainment', icon: 'music_note', status: 'safe' },
        { id: 'sub3', name: 'Amazon Prime', cardId: 'hdfc', amount: 208, billingType: 'recurring', cycle: 'monthly', renewalDays: 8, category: 'Shopping', icon: 'shopping_cart', status: 'warning' },
        { id: 'sub4', name: 'YouTube Premium', cardId: 'icici', amount: 189, billingType: 'recurring', cycle: 'monthly', renewalDays: 20, category: 'Entertainment', icon: 'smart_display', status: 'safe' },
        { id: 'sub5', name: 'Disney+ Hotstar', cardId: 'icici', amount: 299, billingType: 'recurring', cycle: 'monthly', renewalDays: 5, category: 'Entertainment', icon: 'live_tv', status: 'warning' },
        { id: 'sub6', name: 'Zomato Pro', cardId: 'icici', amount: 149, billingType: 'recurring', cycle: 'monthly', renewalDays: 18, category: 'Food', icon: 'delivery_dining', status: 'safe' },
        { id: 'sub7', name: 'Canva Pro', cardId: 'sbi', amount: 499, billingType: 'recurring', cycle: 'monthly', renewalDays: 15, category: 'Productivity', icon: 'brush', status: 'safe' },
        { id: 'sub8', name: 'Adobe Creative Cloud', cardId: 'sbi', amount: 0, billingType: 'trial', cycle: null, renewalDays: 4, trialEndsAmount: 1675, category: 'Productivity', icon: 'gesture', status: 'trial-urgent' },
        { id: 'sub9', name: 'Google One', cardId: 'sbi', amount: 130, billingType: 'recurring', cycle: 'monthly', renewalDays: 22, category: 'Cloud', icon: 'cloud', status: 'safe' },
        { id: 'sub10', name: 'Zoom Pro', cardId: 'axis', amount: 1100, billingType: 'recurring', cycle: 'monthly', renewalDays: 45, category: 'Productivity', icon: 'video_call', status: 'safe' },
        { id: 'sub11', name: 'Swiggy One', cardId: 'axis', amount: 299, billingType: 'recurring', cycle: 'monthly', renewalDays: 9, category: 'Food', icon: 'fastfood', status: 'warning' },
        { id: 'sub12', name: 'LinkedIn Premium', cardId: 'axis', amount: 2499, billingType: 'recurring', cycle: 'monthly', renewalDays: 30, category: 'Professional', icon: 'work', status: 'safe' }
      ],
      smsQueue: [
        { id: 'sms1', raw: 'Your HDFC Bank Credit Card XX4521 has been debited for INR 649.00 at NETFLIX on 28-Mar-2026. Available limit: Rs.4,19,351.00', merchant: 'Netflix', amount: 649, cardLastFour: '4521', cardId: 'hdfc', bank: 'HDFC Bank', date: '28-Mar-2026' },
        { id: 'sms2', raw: 'Your ICICI Bank Credit Card XX8834 has been debited for INR 299.00 at HOTSTAR on 28-Mar-2026. Avl Limit: Rs.2,45,701.00', merchant: 'Disney+ Hotstar', amount: 299, cardLastFour: '8834', cardId: 'icici', bank: 'ICICI Bank', date: '28-Mar-2026' },
        { id: 'sms3', raw: 'Your SBI Credit Card XX2210 has been debited for INR 499.00 at CANVA on 28-Mar-2026. Available Credit Limit: Rs.1,87,501.00', merchant: 'Canva Pro', amount: 499, cardLastFour: '2210', cardId: 'sbi', bank: 'State Bank of India', date: '28-Mar-2026' }
      ]
    };

    /* ═══ HELPERS ═══ */
    const $ = s => document.querySelector(s);
    const $$ = s => document.querySelectorAll(s);
    const fmt = n => '₹' + n.toLocaleString('en-IN');
    const subsFor = cid => S.subscriptions.filter(s => s.cardId === cid);
    const totalMonthly = () => S.subscriptions.reduce((a, s) => a + (s.billingType === 'trial' ? 0 : s.amount), 0);
    const subCount = () => S.subscriptions.filter(s => s.billingType !== 'trial').length;
    const statusStyle = {
      urgent: { border: 'border-error', icon: 'text-error', pill: 'bg-error-container/20 text-error', bar: 'bg-error', days: 'text-error' },
      warning: { border: 'border-secondary', icon: 'text-secondary', pill: 'bg-secondary-container/20 text-secondary', bar: 'bg-secondary', days: 'text-secondary' },
      'trial-urgent': { border: 'border-primary', icon: 'text-primary', pill: 'bg-primary/10 text-primary', bar: 'bg-primary', days: 'text-primary' },
      safe: { border: 'border-on-surface-variant/30', icon: 'text-on-surface-variant', pill: 'bg-surface-container-highest/50 text-on-surface-variant', bar: 'bg-on-surface-variant/30', days: 'text-on-surface-variant' }
    };
    const statusLabel = s => s === 'urgent' ? 'Urgent' : s === 'warning' ? 'Warning' : s === 'trial-urgent' ? 'Trial' : 'Safe';
    const gradientFor = bank => { const m = { 'HDFC Bank': 'from-[#8b1d1d] via-[#e11d48] to-[#4c0519]', 'ICICI Bank': 'from-[#E65C00] to-[#993D00]', 'State Bank of India': 'from-[#003366] to-[#001A33]', 'Axis Bank': 'from-[#4A0E1C] to-[#2D0911]' }; return m[bank] || 'from-[#1a1a2e] to-[#16213e]' };

    function countUp(el, target, dur = 1500) { let st = performance.now(); const up = now => { let p = Math.min((now - st) / dur, 1); p = 1 - Math.pow(1 - p, 3); el.textContent = Math.round(p * target).toLocaleString('en-IN'); if (p < 1) requestAnimationFrame(up) }; requestAnimationFrame(up) }

    /* ═══ TOAST ═══ */
    function showSMSToast(sms) {
      const t = $('#sms-toast');
      t.innerHTML = `<div class="bg-surface-container-highest/90 backdrop-blur-md rounded-full p-3 px-4 border border-outline-variant/20 editorial-shadow flex items-center gap-3">
    <div class="w-10 h-10 bg-gradient-to-br from-primary to-primary-container rounded-full flex items-center justify-center flex-shrink-0"><span class="ms-fill text-on-primary text-[18px]">sms</span></div>
    <div class="flex-1 min-w-0"><p class="text-[10px] font-bold font-headline tracking-wider text-primary uppercase">Bank SMS Detected</p><p class="text-sm text-on-surface truncate">${sms.bank}: Card ••${sms.cardLastFour} debited ${fmt(sms.amount)} at ${sms.merchant.toUpperCase()}</p></div>
    <span class="text-[10px] text-on-surface-variant font-medium flex-shrink-0">Now</span></div>`;
      t.style.transform = 'translateY(-120%)'; t.classList.remove('hidden');
      requestAnimationFrame(() => { t.style.transition = 'transform 0.4s cubic-bezier(0.34,1.56,0.64,1)'; t.style.transform = 'translateY(0)' });
      setTimeout(() => { t.style.transform = 'translateY(-120%)'; setTimeout(() => { t.classList.add('hidden'); showSMSPrompt() }, 400) }, 2500);
    }
    function showGenericToast(type, msg) {
      const t = $('#sms-toast'); const ic = { success: 'check_circle', error: 'error', info: 'info' }; const cl = { success: 'text-green-400', error: 'text-error', info: 'text-primary' };
      t.innerHTML = `<div class="bg-surface-container-highest/90 backdrop-blur-md rounded-full p-3 px-4 border border-outline-variant/20 editorial-shadow flex items-center gap-3"><span class="ms ${cl[type]} text-xl">${ic[type]}</span><span class="text-sm text-on-surface flex-1">${msg}</span></div>`;
      t.style.transform = 'translateY(-120%)'; t.classList.remove('hidden');
      requestAnimationFrame(() => { t.style.transition = 'transform 0.4s cubic-bezier(0.34,1.56,0.64,1)'; t.style.transform = 'translateY(0)' });
      setTimeout(() => { t.style.transform = 'translateY(-120%)'; setTimeout(() => t.classList.add('hidden'), 400) }, 3000);
    }

    /* ═══ SMS FLOW ═══ */
    function simulateSMS() {
      if (!S.smsQueue.length) return showGenericToast('info', 'No more SMS in queue');
      const sms = S.smsQueue[0]; S.pendingSMS = sms; S.smsStep = 1; S.smsBillingType = null; S.smsCycle = null;
      const btn = $('#sim-btn'); if (btn) { btn.disabled = true; btn.innerHTML = '<span class="ms animate-spin text-lg">progress_activity</span> Listening...'; }
      setTimeout(() => { showSMSToast(sms); if (btn) { btn.disabled = false; btn.innerHTML = '<span class="ms text-lg">sms</span> Simulate Incoming SMS'; } }, 2500);
    }
    function showSMSPrompt() { $('#bottom-nav').classList.add('hidden'); $('#sms-overlay').classList.remove('hidden'); const sh = $('#sms-sheet'); sh.classList.remove('hidden'); sh.style.transform = 'translateY(100%)'; requestAnimationFrame(() => { sh.style.transition = 'transform 0.4s cubic-bezier(0.34,1.56,0.64,1)'; sh.style.transform = 'translateY(0)' }); renderSMSPrompt() }
    function closeSMSPrompt() { const sh = $('#sms-sheet'); sh.style.transform = 'translateY(100%)'; setTimeout(() => { $('#sms-overlay').classList.add('hidden'); sh.classList.add('hidden'); $('#bottom-nav').classList.remove('hidden') }, 400) }

    function renderSMSPrompt() {
      const sms = S.pendingSMS; if (!sms) return; const sc = $('#sms-sheet-content');
      if (S.smsStep === 1) {
        const selR = S.smsBillingType === 'recurring', selT = S.smsBillingType === 'trial';
        sc.innerHTML = `
      <p class="text-[10px] font-label uppercase tracking-[0.2em] text-primary mb-3">SpendSync Detected a Charge</p>
      <div class="bg-surface rounded-xl p-3 font-mono text-xs text-on-surface-variant border border-outline-variant mb-5 leading-relaxed">${sms.raw}</div>
      <div class="bg-surface-container-highest rounded-2xl p-4 mb-6 space-y-3">
        ${[['Merchant', sms.merchant], ['Amount', fmt(sms.amount)], ['Card', sms.bank.split(' ')[0] + ' ••' + sms.cardLastFour], ['Date', sms.date]].map(([l, v]) => `<div class="flex items-center justify-between"><div class="flex items-center gap-2"><span class="ms text-green-400 text-[16px]">check_circle</span><span class="text-on-surface-variant text-xs">${l}</span></div><div class="text-right"><span class="text-white font-bold text-sm">${v}</span><span class="text-green-400 text-[10px] ml-2">Auto-detected</span></div></div>`).join('')}
      </div>
      <p class="font-headline font-semibold text-white text-base mb-4">One question — what is this charge?</p>
      <div class="grid grid-cols-2 gap-3 mb-5">
        <button onclick="S.smsBillingType='recurring';renderSMSPrompt()" class="rounded-2xl p-5 flex flex-col items-center gap-2 border transition-all active:scale-95 ${selR ? 'border-primary bg-primary/10' : 'border-outline-variant bg-surface-container-highest'}"><span class="ms text-2xl ${selR ? 'text-primary' : 'text-on-surface-variant'}">repeat</span><span class="text-sm font-headline font-semibold ${selR ? 'text-primary' : 'text-on-surface'}">Recurring Subscription</span></button>
        <button onclick="S.smsBillingType='trial';renderSMSPrompt()" class="rounded-2xl p-5 flex flex-col items-center gap-2 border transition-all active:scale-95 ${selT ? 'border-primary bg-primary/10' : 'border-outline-variant bg-surface-container-highest'}"><span class="ms text-2xl ${selT ? 'text-primary' : 'text-on-surface-variant'}">timer</span><span class="text-sm font-headline font-semibold ${selT ? 'text-primary' : 'text-on-surface'}">Free Trial</span></button>
      </div>
      ${S.smsBillingType ? `<button onclick="S.smsStep=2;renderSMSPrompt()" class="w-full bg-gradient-to-r from-primary to-primary-container text-on-primary rounded-full py-4 font-headline font-bold active:scale-95 transition-transform">Next</button>` : ''}`;
      } else {
        const back = `<div class="flex items-center justify-between mb-4"><button onclick="S.smsStep=1;renderSMSPrompt()" class="p-1"><span class="ms text-on-surface-variant">chevron_left</span></button><div class="flex gap-1.5"><span class="w-2 h-2 rounded-full bg-primary/40"></span><span class="w-2 h-2 rounded-full bg-primary"></span></div><div class="w-8"></div></div>`;
        if (S.smsBillingType === 'recurring') {
          sc.innerHTML = back + `<p class="font-headline font-semibold text-white text-base mb-5">How often does this charge repeat?</p><div class="space-y-3">
        ${['monthly', 'quarterly', 'yearly'].map(c => {
            const sel = S.smsCycle === c; const labels = { monthly: 'Monthly', quarterly: 'Quarterly', yearly: 'Yearly' }; const subs = { monthly: `${fmt(sms.amount)} every month`, quarterly: `${fmt(sms.amount)} every 3 months`, yearly: `${fmt(sms.amount)} per year` };
            return `<button onclick="S.smsCycle='${c}';renderSMSPrompt()" class="w-full rounded-full p-4 text-left border transition-all active:scale-95 flex justify-between items-center ${sel ? 'border-primary bg-primary/10' : 'border-outline-variant bg-surface-container-highest'}"><div><span class="font-headline font-semibold ${sel ? 'text-primary' : 'text-white'}">${labels[c]}</span><p class="text-xs text-on-surface-variant">${subs[c]}</p></div></button>`
          }).join('')}
      </div>${S.smsCycle ? `<button onclick="completeSMSFlow()" class="w-full bg-gradient-to-r from-primary to-primary-container text-on-primary rounded-full py-4 font-headline font-bold active:scale-95 transition-transform duration-150 mt-6">Done — Track This Subscription</button>` : ''}`;
        } else {
          sc.innerHTML = back + `<p class="font-headline font-semibold text-white text-base mb-5">When does your free trial end?</p>
        <input type="date" id="trial-date" class="w-full bg-surface-container-highest border border-primary rounded-full px-4 py-4 text-white text-center text-lg font-body focus:outline-none mb-4">
        <div class="flex items-start gap-2 bg-secondary/10 rounded-xl p-3 border border-secondary/20"><span class="ms text-secondary text-lg">warning</span><p class="text-secondary text-xs">SpendSync will alert you 3 days before this date so you can cancel before being charged.</p></div>
        <button onclick="completeSMSFlow()" class="w-full bg-gradient-to-r from-primary to-primary-container text-on-primary rounded-full py-4 font-headline font-bold active:scale-95 transition-transform duration-150 mt-6">Done — Track Trial</button>`;
        }
      }
    }
    function completeSMSFlow() {
      const sms = S.pendingSMS; if (!sms) return;
      if (S.smsBillingType === 'recurring' && !S.smsCycle) return showGenericToast('error', 'Please select a billing cycle');
      if (S.smsBillingType === 'trial' && !$('#trial-date')?.value) return showGenericToast('error', 'Please select trial end date');
      S.subscriptions.push({ id: 'sub-' + Date.now(), name: sms.merchant, cardId: sms.cardId, amount: S.smsBillingType === 'trial' ? 0 : sms.amount, billingType: S.smsBillingType, cycle: S.smsBillingType === 'trial' ? null : S.smsCycle, renewalDays: S.smsBillingType === 'trial' ? 7 : 30, category: 'Other', icon: 'subscriptions', status: S.smsBillingType === 'trial' ? 'trial-urgent' : 'safe', trialEndsAmount: S.smsBillingType === 'trial' ? sms.amount : undefined });
      S.smsQueue.shift(); closeSMSPrompt();
      setTimeout(() => { navigate('dashboard'); showGenericToast('success', `${sms.merchant} added successfully!`) }, 500);
    }

    /* ═══ NAVIGATION ═══ */
    function navigate(target, data) {
      $$('.screen').forEach(s => { s.classList.add('hidden'); s.classList.remove('active') });
      const el = $('#screen-' + target); el.classList.remove('hidden'); el.classList.add('active');
      S.currentScreen = target; if (data?.cardId) S.selectedCardId = data.cardId;
      renderScreen(target); updateBottomNav(target);
      $('#floating-bar').classList.toggle('hidden', target !== 'subscriptions');
      window.scrollTo(0, 0);
    }
    function renderScreen(t) {
      const fn = { dashboard: renderDashboard, subscriptions: renderSubscriptions, 'add-card': renderAddCard, analytics: renderAnalytics, alerts: renderAlerts, advisor: renderAdvisor, dna: renderDNA };
      if (fn[t]) fn[t]();
    }

    /* ═══ HEADER ═══ */
    function renderHeader(mode, title) {
      const h = $('#header-inner');
      if (mode === 'home') {
        h.innerHTML = `<div class="flex items-center gap-3"><span class="ms-fill text-primary">account_balance_wallet</span><span class="text-xl font-bold tracking-tight text-primary font-headline">SpendSync</span></div>

        ${peers.map(p => `
        <div class="p-5 rounded-2xl bg-surface-container border border-outline-variant/10 flex flex-col justify-between h-full hover:bg-surface-container-high transition-colors">

            <p class="text-on-surface-variant text-xs leading-relaxed">${p.text}</p>

          <button class="mt-6 text-brand-teal text-xs font-semibold flex items-center gap-1 transition-all">
            See offer on your SBI card <span class="ms text-[14px]">arrow_forward</span>
          </button>
        </div>`).join('')}
      </div>
    </section>

    <!-- SECTION 4: LIFE STAGE ALERT (Urgent) -->
    <section class="bg-[#1C1400] border border-secondary/20 rounded-3xl p-6 md:p-8 space-y-6 relative overflow-hidden">
      <div class="absolute top-0 right-0 p-4 opacity-10">
        <span class="ms text-6xl text-secondary">warning</span>
      </div>
      <div class="space-y-2 relative z-10">
        <div class="flex items-center gap-2 text-secondary">
          <span class="ms text-sm">emergency_home</span>

      </div>
      <div class="flex flex-wrap gap-2 relative z-10">
        <span class="px-3 py-1 rounded-full bg-[#332500] text-secondary text-[10px] font-bold uppercase tracking-tight border border-secondary/10">Zoom Pro added</span>
        <span class="px-3 py-1 rounded-full bg-[#332500] text-secondary text-[10px] font-bold uppercase tracking-tight border border-secondary/10">Notion added</span>

            <span class="ms text-brand-teal">receipt_long</span>
          </div>
          <p class="text-on-surface text-sm font-medium">6 of your subscriptions may be GST-claimable as business expenses</p>
        </div>
        <button class="bg-brand-teal text-[#3f4041] font-headline font-bold px-6 py-3 rounded-full active:scale-95 transition-all shadow-lg shadow-brand-teal/20 whitespace-nowrap">
          Set up GST tracking →

      </div>
    </section>

    <!-- SECTION 5: DNA EVOLUTION -->
    <section class="space-y-8 py-8">
      <h3 class="font-headline font-bold text-xl text-on-surface px-2">DNA evolution</h3>
      <div class="relative px-4">
        <div class="absolute top-1/2 left-4 right-4 h-px bg-outline-variant/30 -translate-y-1/2"></div>
        <div class="relative z-10 flex justify-between">
          <div class="flex flex-col items-center gap-4">
            <div class="w-4 h-4 rounded-full bg-outline-variant border-4 border-surface"></div>
            <div class="text-center"><p class="text-on-surface-variant font-headline font-bold text-sm">Student</p><p class="text-on-surface-variant font-label text-[10px]">18m ago</p></div>
          </div>
          <div class="flex flex-col items-center gap-4">
            <div class="w-4 h-4 rounded-full bg-outline-variant border-4 border-surface"></div>
            <div class="text-center"><p class="text-on-surface-variant font-headline font-bold text-sm">Young Professional</p><p class="text-on-surface-variant font-label text-[10px]">8m ago</p></div>
          </div>
          <div class="flex flex-col items-center gap-4">
            <div class="w-6 h-6 rounded-full bg-brand-teal border-4 border-surface-container shadow-[0_0_15px_rgba(0,201,167,0.5)]"></div>
            <div class="text-center"><p class="text-brand-teal font-headline font-bold text-sm">Creator</p><p class="text-brand-teal font-label text-[10px]">Now</p></div>
          </div>
        </div>
      </div>
    </section>
  </div>`;
    }

    /* ═══ INIT ═══ */
    function init() {
      $$('.screen').forEach(s => s.classList.add('hidden'));
      $('#screen-dashboard').classList.remove('hidden'); $('#screen-dashboard').classList.add('active');
      renderDashboard(); updateBottomNav('dashboard');

    document.addEventListener('DOMContentLoaded', init);
